<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Squadron</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed chase-cam view, HUD pinned to the corners like an arcade cabinet */
:root {
  --void: #0d0a22;
  --ink: #eef3ff;
  --dim: #9aa3c7;
  --hud: #8dff7a;
  --amber: #ffb347;
  --danger: #ff4d5e;
  --panel: rgba(12, 10, 34, .66);
  --line: rgba(141, 255, 122, .35);
  --display: "Audiowide", "Chakra Petch", system-ui, sans-serif;
  --ui: "Chakra Petch", ui-monospace, system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; font-family: var(--ui); }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }

.hud { position: fixed; pointer-events: none; font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: .08em; }
#tl { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; gap: 22px; }
#tr { top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; text-align: right; }
.label { font-size: 11px; color: var(--dim); }
.big { font-family: var(--display); font-size: 26px; color: var(--ink); line-height: 1.1; }
#shield { width: min(220px, 38vw); height: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); margin-top: 6px; padding: 2px; margin-left: auto; }
#shield i { display: block; height: 100%; width: 100%; background: var(--hud); transition: width .15s, background-color .3s; }
#boss { top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); text-align: center; }
#boss .bar { height: 10px; border: 1px solid rgba(255, 77, 94, .5); padding: 2px; background: rgba(0,0,0,.35); margin-top: 4px; }
#boss .bar i { display: block; height: 100%; background: var(--danger); transition: width .15s; }
#boss .label { color: var(--danger); }
#hint { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: 16px; font-size: 11px; color: var(--dim); }

#radio { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; display: flex; gap: 12px; align-items: center;
  max-width: min(520px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line);
  padding: 10px 14px 10px 10px; opacity: 0; transform: translateY(16px); transition: opacity .25s, transform .25s; }
#radio.on { opacity: 1; transform: none; }
.face { width: 52px; height: 52px; flex: none; display: grid; place-items: center; font-family: var(--display); font-size: 24px; color: var(--void);
  background-color: var(--c, var(--amber));
  background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 2px, transparent 2px 4px); }
#radio .who { font-size: 11px; color: var(--c, var(--amber)); }
#radio .msg { font-size: 15px; line-height: 1.35; text-transform: none; letter-spacing: .01em; margin-top: 2px; }

#flash { position: fixed; inset: 0; background: var(--danger); opacity: 0; pointer-events: none; }

#overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; overflow-y: auto;
  background: radial-gradient(ellipse at center, rgba(13,10,34,.3), rgba(13,10,34,.88)); }
.card { max-width: 560px; width: 100%; text-align: center; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 9vw, 76px); margin: 0; letter-spacing: .04em; line-height: 1;
  text-wrap: balance; color: var(--ink); text-shadow: 0 0 28px rgba(255, 179, 71, .5); }
.kicker { color: var(--amber); letter-spacing: .32em; font-size: 12px; margin-bottom: 12px; text-transform: uppercase; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; text-align: left; margin: 28px auto; max-width: 380px; font-size: 14px; align-items: center; }
kbd { font-family: var(--ui); font-weight: 700; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 3px; padding: 2px 7px;
  border-radius: 4px; color: var(--hud); background: rgba(0,0,0,.45); white-space: nowrap; }
.cta { font-family: var(--display); color: var(--hud); font-size: 18px; letter-spacing: .08em; background: none; border: 1px solid var(--line);
  cursor: pointer; padding: 10px 18px; animation: blink 1.1s steps(2) infinite; }
.cta:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 26px 0; }
.stats .big { font-size: 24px; }
.note { color: var(--dim); font-size: 12px; margin-top: 16px; }
.pop { position: fixed; font-family: var(--display); font-size: 14px; color: var(--hud); pointer-events: none; transform: translate(-50%, -50%);
  animation: rise .9s ease-out forwards; text-shadow: 0 0 8px #000; white-space: nowrap; }
@keyframes rise { to { transform: translate(-50%, -170%); opacity: 0; } }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .cta { animation: none; } }
@media (max-width: 520px) { #tl { gap: 14px; } .big { font-size: 20px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="flash"></div>

<div class="hud" id="tl">
  <div><div class="label">Score</div><div class="big" id="score">0</div></div>
  <div><div class="label">Hits</div><div class="big" id="hits">0</div></div>
</div>
<div class="hud" id="tr">
  <div class="label">Shield</div>
  <div id="shield"><i></i></div>
</div>
<div class="hud" id="boss" hidden>
  <div class="label">Carrier Mk.IV</div>
  <div class="bar"><i></i></div>
</div>
<div class="hud" id="radio"><div class="face"></div><div><div class="who"></div><div class="msg"></div></div></div>
<div class="hud" id="hint">P pause · M mute</div>

<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer & scene ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.domElement.tabIndex = 0;
stage.appendChild(renderer.domElement);

const FOG = 0x2a1d4a;
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 90, 360);
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 1200);
camera.position.set(0, 7, 11);

function resize() {
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

scene.add(new THREE.HemisphereLight(0xbcc8ff, 0x3a2a20, 0.85));
const sun = new THREE.DirectionalLight(0xffd2a0, 1.1);
sun.position.set(-40, 60, 30);
scene.add(sun);

/* sky backdrop: dusk gradient, sun, mountains */
(function backdrop() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#120c33'); g.addColorStop(.45, '#4a2a6a'); g.addColorStop(.72, '#c0566e'); g.addColorStop(.86, '#ff9a5a'); g.addColorStop(1, '#2a1d4a');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 160; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * .7})`; x.fillRect(Math.random() * 1024, Math.random() * 200, 1.5, 1.5); }
  const sg = x.createRadialGradient(640, 380, 10, 640, 380, 120);
  sg.addColorStop(0, 'rgba(255,240,200,1)'); sg.addColorStop(.35, 'rgba(255,190,110,.9)'); sg.addColorStop(1, 'rgba(255,150,90,0)');
  x.fillStyle = sg; x.fillRect(480, 240, 320, 280);
  const ridge = (base, amp, col, seed) => {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, 512);
    for (let i = 0; i <= 1024; i += 16) x.lineTo(i, base - Math.abs(Math.sin(i * .011 + seed) * amp + Math.sin(i * .037 + seed * 2) * amp * .35));
    x.lineTo(1024, 512); x.fill();
  };
  ridge(430, 60, '#5a3466', 1); ridge(462, 44, '#3a2452', 4);
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1700, 560), new THREE.MeshBasicMaterial({ map: tex, fog: false }));
  m.position.set(0, 150, -430);
  scene.add(m);
})();

/* scrolling ground */
const groundTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#1d4744'; x.fillRect(0, 0, 128, 128);
  x.fillStyle = '#21504c'; x.fillRect(0, 0, 64, 64); x.fillRect(64, 64, 64, 64);
  x.strokeStyle = 'rgba(90,230,200,.55)'; x.lineWidth = 2; x.strokeRect(1, 1, 126, 126);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(45, 22);
  t.anisotropy = 4;
  return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 440), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.z = -200;
scene.add(ground);

/* ---------- materials & shared geometry ---------- */
const M = {
  white: new THREE.MeshStandardMaterial({ color: 0xe8ecf4, flatShading: true, metalness: .2, roughness: .5 }),
  blue: new THREE.MeshStandardMaterial({ color: 0x2f6bff, flatShading: true, roughness: .4 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x6fe3ff, emissive: 0x1a6a88, flatShading: true }),
  red: new THREE.MeshStandardMaterial({ color: 0xb8323a, flatShading: true }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2b2238, flatShading: true, roughness: .8 }),
  eye: new THREE.MeshBasicMaterial({ color: 0xffd400 }),
  laser: new THREE.MeshBasicMaterial({ color: 0x7dff6a }),
  shot: new THREE.MeshBasicMaterial({ color: 0xff6a3c }),
  shotDeflect: new THREE.MeshBasicMaterial({ color: 0x66ccff }),
  tower: new THREE.MeshStandardMaterial({ color: 0x6b5a9a, flatShading: true }),
  towerTop: new THREE.MeshBasicMaterial({ color: 0xff4d8a }),
  arch: new THREE.MeshStandardMaterial({ color: 0xd8c9a0, flatShading: true }),
  silver: new THREE.MeshStandardMaterial({ color: 0xdfe8f5, emissive: 0x556070, metalness: .9, roughness: .2 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xffd04a, emissive: 0x6a4a00, metalness: .9, roughness: .2 }),
  core: new THREE.MeshStandardMaterial({ color: 0xff2a6d, emissive: 0xaa1040, flatShading: true }),
  bossShield: new THREE.MeshBasicMaterial({ color: 0x66ccff, transparent: true, opacity: .22 }),
  sceneryA: new THREE.MeshStandardMaterial({ color: 0x5b4b8a, flatShading: true }),
  sceneryB: new THREE.MeshStandardMaterial({ color: 0x3d5f8c, flatShading: true }),
  sceneryC: new THREE.MeshStandardMaterial({ color: 0x7a5a7a, flatShading: true }),
  tree: new THREE.MeshStandardMaterial({ color: 0x2f7a55, flatShading: true }),
};
const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  laser: new THREE.BoxGeometry(.16, .16, 2.8),
  shot: new THREE.SphereGeometry(.45, 8, 6),
  part: new THREE.BoxGeometry(.5, .5, .5),
  cone: new THREE.ConeGeometry(1, 1, 6),
  ring: new THREE.TorusGeometry(1.9, .28, 8, 28),
  flash: new THREE.SphereGeometry(1, 12, 8),
};
const partMats = [0xffe066, 0xff8a3d, 0xff4d4d, 0xffffff].map(c => new THREE.MeshBasicMaterial({ color: c }));
const sparkMats = [0x9dfcff, 0xffffff].map(c => new THREE.MeshBasicMaterial({ color: c }));

/* ---------- models ---------- */
function makeShip() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(.55, 3.4, 5), M.white);
  body.rotation.x = -Math.PI / 2; g.add(body);
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(.38, 8, 6), M.glass);
  canopy.scale.set(1, .7, 1.8); canopy.position.set(0, .28, .3); g.add(canopy);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(4.2, .1, 1.1), M.white);
  wing.position.set(0, -.15, .9); g.add(wing);
  for (const s of [-1, 1]) {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(.12, 1.7, 1.2), M.blue);
    fin.position.set(s * 2.1, .25, 1.0); fin.rotation.z = -s * .35; g.add(fin);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(.15, .08, 2.3), M.blue);
    blade.position.set(s * 1.4, -.15, .2); blade.rotation.y = s * .5; g.add(blade);
  }
  const engine = new THREE.Mesh(new THREE.CylinderGeometry(.35, .25, .5, 8), new THREE.MeshBasicMaterial({ color: 0xffb347 }));
  engine.rotation.x = Math.PI / 2; engine.position.z = 1.75; g.add(engine);
  const flame = new THREE.Mesh(new THREE.ConeGeometry(.3, 1.4, 8), new THREE.MeshBasicMaterial({ color: 0x7fd8ff, transparent: true, opacity: .8 }));
  flame.rotation.x = Math.PI / 2; flame.position.z = 2.6; g.add(flame);
  g.userData.flame = flame;
  return g;
}
function makeFighter() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), M.red);
  body.scale.set(1, .5, 1.7); g.add(body);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(3.8, .12, .9), M.dark);
  wing.position.z = -.3; g.add(wing);
  for (const s of [-1, 1]) {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(.15, 1.2, 1.4), M.red);
    tip.position.set(s * 1.9, .2, -.3); tip.rotation.z = s * .4; g.add(tip);
  }
  const eye = new THREE.Mesh(new THREE.SphereGeometry(.28, 8, 6), M.eye);
  eye.position.set(0, .18, 1.25); g.add(eye);
  return g;
}

/* ---------- audio (synthesized, starts on first key) ---------- */
let actx = null, master = null, muted = false, noiseBuf = null;
function initAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = .45; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur);
}
const sfx = {
  laser: () => tone('square', 1300, 240, .09, .05),
  boom: (big) => { noise(big ? 1.1 : .45, big ? .6 : .35, big ? 1600 : 2400); tone('sine', 120, 40, big ? .8 : .3, .25); },
  hit: () => { tone('sawtooth', 180, 60, .25, .18); noise(.2, .2, 900); },
  ping: () => tone('triangle', 2200, 1800, .06, .05),
  deflect: () => tone('square', 600, 1800, .08, .06),
  ring: () => { tone('sine', 880, 880, .1, .12); tone('sine', 1320, 1320, .12, .12, .08); tone('sine', 1760, 1760, .18, .12, .16); },
  roll: () => noise(.35, .12, 3000),
  radio: () => tone('square', 1500, 1500, .04, .03),
};

/* ---------- input ---------- */
const keys = {};
const lastTap = { ArrowLeft: 0, ArrowRight: 0 };
const GAME_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);
addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  initAudio();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space' && (game.state === 'title' || ((game.state === 'dead' || game.state === 'win') && game.overReady))) { start(); return; }
  if ((e.code === 'KeyP' || e.code === 'Escape') && (game.state === 'play' || game.state === 'paused')) { togglePause(); return; }
  if (e.code === 'KeyM') { muted = !muted; popCenter(muted ? 'SOUND OFF' : 'SOUND ON'); return; }
  if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && game.state === 'play') {
    const now = performance.now();
    if (now - lastTap[e.code] < 280 && P.rollT <= 0) startRoll(e.code === 'ArrowRight' ? 1 : -1);
    lastTap[e.code] = now;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (game.state === 'play') togglePause(); });
renderer.domElement.addEventListener('pointerdown', () => renderer.domElement.focus());

/* ---------- HUD helpers ---------- */
const hud = {
  score: $('score'), hits: $('hits'), shield: document.querySelector('#shield i'),
  boss: $('boss'), bossBar: document.querySelector('#boss .bar i'),
  radio: $('radio'), face: document.querySelector('#radio .face'), who: document.querySelector('#radio .who'), msg: document.querySelector('#radio .msg'),
  flash: $('flash'), overlay: $('overlay'),
};
const CREW = {
  VIX: { name: 'Vix · Lead', color: '#ffb347' },
  BRAM: { name: 'Bram · Wing 2', color: '#8dff7a' },
  PELL: { name: 'Pell · Wing 3', color: '#ff7ac8' },
  OPS: { name: 'Ops · Carrier Halcyon', color: '#7ac8ff' },
};
const radioQ = []; let radioT = 0;
function radio(who, text) { radioQ.push({ who, text }); }
function updateRadio(dt) {
  if (radioT > 0) { radioT -= dt; if (radioT <= 0) hud.radio.classList.remove('on'); return; }
  if (!radioQ.length) return;
  const { who, text } = radioQ.shift(), c = CREW[who];
  hud.radio.style.setProperty('--c', c.color);
  hud.face.textContent = who[0];
  hud.who.textContent = c.name;
  hud.msg.textContent = text;
  hud.radio.classList.add('on');
  radioT = 2.2 + text.length * .045;
  sfx.radio();
}
const _v = new THREE.Vector3();
function popText(pos, text, color) {
  _v.copy(pos).project(camera);
  if (_v.z > 1) return;
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text;
  if (color) el.style.color = color;
  el.style.left = ((_v.x + 1) / 2 * innerWidth) + 'px';
  el.style.top = ((1 - _v.y) / 2 * innerHeight) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
function popCenter(text) {
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text;
  el.style.left = '50%'; el.style.top = '40%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
let flashV = 0, shake = 0;

/* ---------- game state ---------- */
const ROLL_DUR = .55, BOSS_T = 96;
const S = 46; // world scroll speed
const game = { state: 'title', t: 0, score: 0, hits: 0, shots: 0, landed: 0, shield: 100, overT: 0, overReady: false, said: {}, scriptIdx: 0, dirT: 0, ringT: 0, sceneT: 0 };
const P = { x: 0, y: 5, vx: 0, vy: 0, roll: 0, rollT: 0, rollDir: 0, inv: 0, fireCD: 0 };
const ship = makeShip(); scene.add(ship);

const bolts = [], shots = [], enemies = [], obstacles = [], rings = [], parts = [], scenery = [];
let boss = null;

function makeReticle(size) {
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(size, size)),
    new THREE.LineBasicMaterial({ color: 0x8dff7a, depthTest: false, transparent: true, opacity: .85, fog: false }));
  l.renderOrder = 10; scene.add(l); return l;
}
const ret1 = makeReticle(1.6), ret2 = makeReticle(2.4);

/* scenery: city blocks and trees along the flanks */
function placeScenery(o, z) {
  const side = Math.random() < .5 ? -1 : 1;
  const x = side * rand(26, 90);
  if (o.userData.tree) {
    const h = rand(3, 7); o.scale.set(h * .45, h, h * .45); o.position.set(x, h / 2, z);
  } else {
    const w = rand(4, 10), h = rand(4, 28), d = rand(4, 10);
    o.scale.set(w, h, d); o.position.set(x, h / 2, z);
  }
}
for (let i = 0; i < 70; i++) {
  const tree = i % 3 === 0;
  const o = new THREE.Mesh(tree ? G.cone : G.box, tree ? M.tree : pick([M.sceneryA, M.sceneryB, M.sceneryC]));
  o.userData.tree = tree;
  placeScenery(o, rand(-400, 20));
  scene.add(o); scenery.push(o);
}

/* ---------- spawners ---------- */
function spawnFighter(o) {
  const m = makeFighter();
  m.position.set(o.x, o.y, o.z);
  scene.add(m);

  g.position.z = lerp(g.position.z, -88, 1 - Math.exp(-dt * .8));
  g.position.x = Math.sin(B.t * .45) * 9;
  g.position.y = 9 + Math.sin(B.t * .9) * 3;
  g.rotation.z = Math.sin(B.t * .45) * .15;
  B.core.rotation.x += dt; B.core.rotation.y += dt * 1.3;
  const podsAlive = B.pods.some(p => p.alive);
  B.shield.visible = podsAlive;

  if (B.dying > 0) {
    B.dying -= dt; B.boomT -= dt;
    if (B.boomT <= 0) {
      B.boomT = .18;
      explode(_w.set(g.position.x + rand(-10, 10), g.position.y + rand(-6, 6), g.position.z + 3), 14, 1.6);
      sfx.boom(true); shake = reduceMotion ? 0 : .5;
    }
    if (B.dying <= 0) {
      explode(g.position, 60, 3.5); sfx.boom(true);
      scene.remove(g); boss = null; hud.boss.hidden = true;
      win();
    }
    return;
  }

  if (game.state === 'play' && g.position.z > -130) {
    B.fireT -= dt;
    if (podsAlive) {
      if (B.fireT <= 0) {
        for (const p of B.pods) if (p.alive) {
          p.m.getWorldPosition(_w); _w.z += 3;
          for (const off of [-5, 0, 5]) enemyShot(_w, aimAt(_w, 48, off));
        }
        B.fireT = 1.5;
      }
    } else {
      B.core.getWorldPosition(_w); _w.z += 2.5;
      if (B.fireT <= 0) { enemyShot(_w, aimAt(_w, 60)); B.fireT = .75; }
      B.ringT -= dt;
      if (B.ringT <= 0) {
        for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + B.t; enemyShot(_w, new THREE.Vector3(Math.cos(a) * 9, Math.sin(a) * 9, 42)); }
        B.ringT = 2.6;
      }
      B.minionT -= dt;
      if (B.minionT <= 0) { waveSwoop(pick([-1, 1]), 3); B.minionT = 8; }
    }
  }

  for (const b of bolts) {
    if (b.dead) continue;
    let hit = false;
    for (const p of B.pods) {
      if (!p.alive) continue;
      p.m.getWorldPosition(_w);
      if (boltHit(b, _w, 3)) {
        hit = true; landed(b); p.hp--; spark(b.m.position, partMats);
        if (p.hp <= 0) {
          p.alive = false; p.m.visible = false; game.hits++;
          explode(_w, 30, 2.2); sfx.boom(true); addScore(1000, _w);
          if (!B.pods.some(q => q.alive)) radio('PELL', 'Cannons down! The core is exposed. Hit it!');
        }
        break;
      }
    }
    if (hit) continue;
    B.core.getWorldPosition(_w);
    if (boltHit(b, _w, 3)) {
      b.dead = true;
      if (podsAlive) { spark(b.m.position); sfx.ping(); if (!game.said.shield) { game.said.shield = true; radio('BRAM', 'The core is shielded. Knock out the side cannons!'); } }
      else {
        game.landed++; B.coreHp--; spark(b.m.position, partMats);
        if (B.coreHp <= 0) { B.dying = 2.6; game.hits++; addScore(5000, _w, 'CARRIER +5000'); }
      }
      continue;
    }
    _w.copy(g.position);
    if (boltHit(b, _w, 10)) { b.dead = true; spark(b.m.position); }
  }
  const total = B.pods.reduce((s, p) => s + Math.max(0, p.hp), 0) + Math.max(0, B.coreHp);
  hud.bossBar.style.width = (total / (B.podMax * 2 + B.coreMax) * 100) + '%';
}
function sweep(list) {
  for (let i = list.length - 1; i >= 0; i--) if (list[i].dead) { scene.remove(list[i].m); list.splice(i, 1); }
}
let lastHud = '';
function updateHud(dt) {
  const key = game.score + '|' + game.hits + '|' + game.shield;
  if (key !== lastHud) {
    lastHud = key;
    hud.score.textContent = game.score.toLocaleString();
    hud.hits.textContent = game.hits;
    hud.shield.style.width = game.shield + '%';
    hud.shield.style.backgroundColor = game.shield < 35 ? 'var(--danger)' : game.shield < 65 ? 'var(--amber)' : 'var(--hud)';
  }
  flashV = Math.max(0, flashV - dt * 1.8);
  hud.flash.style.opacity = flashV;
}

/* ---------- main loop ---------- */
let last = performance.now(), clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (game.state === 'paused') { renderer.render(scene, camera); return; }
  clock += dt;
  if (game.state === 'play') { game.t += dt; updatePlayer(dt); director(dt); }
  updateShip(dt, clock);
  updateScenery(dt);
  updateBolts(dt);
  updateEnemies(dt);
  updateObstacles(dt);
  updateRings(dt, clock);
  updateBoss(dt);
  updateShots(dt);
  updateParts(dt);
  [bolts, shots, enemies, obstacles, rings, parts].forEach(sweep);
  updateRadio(dt);
  updateHud(dt);
  updateCamera(dt);
  if ((game.state === 'dead' || game.state === 'win') && game.overT > 0) {
    game.overT -= dt;
    if (game.state === 'win') { P.y = lerp(P.y, 9, dt); P.vx = lerp(P.vx, 0, dt * 3); }
    if (game.overT <= 0) endScreen(game.state === 'win');
  }
  renderer.render(scene, camera);
}
titleScreen();
requestAnimationFrame(frame);
})();
</script>
